<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Work Tracker</title><link rel="stylesheet" href="style.css"></head><body><h1>Marketplace Work Tracker</h1><p id="status" aria-live="polite">Loading…</p><p class="muted">Automatically follows the active eBay, Etsy or Amazon tab. ERP work is recorded directly inside the ERP. Idle and unfocused time is excluded. Activity is an estimate, not proof of productivity.</p><button data-action="resume" class="primary">Enable automatic tracking</button><button data-action="pause">Pause tracking</button><button id="settings">Connection settings</button><button data-action="sync">Sync now</button><p id="message" role="status"></p><p id="queue" class="muted"></p><p id="syncStatus" class="muted"></p><p id="error" role="alert"></p><script type="module" src="popup.js"></script></body></html>
